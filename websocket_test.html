<!DOCTYPE html>
<html>

<head>
    <title>WebSocket Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            max-width: 800px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
        }

        .log {
            background: #f5f5f5;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            margin: 10px 0;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .info {
            color: blue;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 WebSocket Debug Test</h1>

        <div>
            <label>WebSocket URL:</label>
            <input type="text" id="wsUrl" value="ws://localhost:8766" style="width: 300px; padding: 5px;">
        </div>

        <div style="margin: 10px 0;">
            <button onclick="connect()">🔗 Connect</button>
            <button onclick="disconnect()">❌ Disconnect</button>
            <button onclick="sendTest()">📤 Send Test Message</button>
            <button onclick="clearLog()">🧹 Clear Log</button>
        </div>

        <div>
            <strong>Connection Status:</strong> <span id="status">Disconnected</span>
        </div>

        <div class="log" id="log"></div>

        <h3>Test URLs:</h3>
        <ul>
            <li><button onclick="setUrl('ws://localhost:8766')">Debug Server (8766)</button></li>
            <li><button onclick="setUrl('ws://localhost:8765')">Robot Server (8765)</button></li>
            <li><button onclick="setUrl('ws://10.236.10.48:8766')">Debug Server (Network)</button></li>
            <li><button onclick="setUrl('ws://10.236.10.48:8765')">Robot Server (Network)</button></li>
        </ul>
    </div>

    <script>
        let socket = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(status) {
            document.getElementById('status').textContent = status;
        }

        function setUrl(url) {
            document.getElementById('wsUrl').value = url;
            log(`📝 Set URL to: ${url}`, 'info');
        }

        function connect() {
            const url = document.getElementById('wsUrl').value;
            if (!url) {
                log('❌ Please enter a WebSocket URL', 'error');
                return;
            }

            if (socket) {
                socket.close();
            }

            log(`🔄 Connecting to: ${url}`, 'info');
            updateStatus('Connecting...');

            try {
                socket = new WebSocket(url);

                socket.onopen = function (event) {
                    log('✅ WebSocket connected successfully!', 'success');
                    updateStatus('Connected');
                };

                socket.onmessage = function (event) {
                    log(`📨 Received: ${event.data}`, 'success');
                };

                socket.onerror = function (error) {
                    log('💥 WebSocket error occurred', 'error');
                    console.error('WebSocket error:', error);
                    updateStatus('Error');
                };

                socket.onclose = function (event) {
                    log(`❌ WebSocket closed. Code: ${event.code}, Reason: ${event.reason}`, 'error');
                    updateStatus('Disconnected');
                    socket = null;
                };

            } catch (error) {
                log(`❌ Failed to create WebSocket: ${error.message}`, 'error');
                updateStatus('Error');
            }
        }

        function disconnect() {
            if (socket) {
                socket.close();
                log('🔌 Disconnected by user', 'info');
            } else {
                log('❌ No active connection', 'error');
            }
        }

        function sendTest() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                const message = `Hello from debug test at ${new Date().toISOString()}`;
                socket.send(message);
                log(`📤 Sent: ${message}`, 'info');
            } else {
                log('❌ WebSocket is not connected', 'error');
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Auto-connect to debug server on page load
        window.onload = function () {
            log('🚀 WebSocket Debug Test loaded', 'info');
        };
    </script>
</body>

</html>
