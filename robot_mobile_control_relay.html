<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🤖 Robot Control via Relay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            color: white;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .status {
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
        }

        .status.connected {
            background: rgba(40, 167, 69, 0.8);
            border: 2px solid rgba(40, 167, 69, 1);
        }

        .status.disconnected {
            background: rgba(220, 53, 69, 0.8);
            border: 2px solid rgba(220, 53, 69, 1);
        }

        .connection-section {
            margin-bottom: 20px;
            text-align: center;
        }

        .connection-input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .connection-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .connection-buttons {
            display: flex;
            gap: 10px;
        }

        /* Arrow Keys Control Section */
        .arrow-section {
            margin: 20px 0;
            text-align: center;
        }

        .arrow-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.9);
        }

        .arrow-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 8px;
            max-width: 200px;
            margin: 0 auto;
        }

        .arrow-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .arrow-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .arrow-up { 
            grid-column: 2; 
            grid-row: 1; 
            background: linear-gradient(135deg, #007bff, #6610f2); 
            color: white; 
        }
        .arrow-left { 
            grid-column: 1; 
            grid-row: 2; 
            background: linear-gradient(135deg, #6f42c1, #e83e8c); 
            color: white; 
        }
        .arrow-down { 
            grid-column: 2; 
            grid-row: 3; 
            background: linear-gradient(135deg, #fd7e14, #e83e8c); 
            color: white; 
        }
        .arrow-right { 
            grid-column: 3; 
            grid-row: 2; 
            background: linear-gradient(135deg, #28a745, #20c997); 
            color: white; 
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .btn {
            padding: 18px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-height: 70px;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .btn-stand { background: linear-gradient(135deg, #28a745, #20c997); color: white; }
        .btn-sit { background: linear-gradient(135deg, #17a2b8, #6f42c1); color: white; }
        .btn-walk { background: linear-gradient(135deg, #007bff, #6610f2); color: white; }
        .btn-distance { background: linear-gradient(135deg, #20c997, #28a745); color: white; }
        .btn-stop { background: linear-gradient(135deg, #dc3545, #fd7e14); color: white; }
        .btn-connect { background: linear-gradient(135deg, #28a745, #20c997); color: white; flex: 1; }
        .btn-disconnect { background: linear-gradient(135deg, #dc3545, #fd7e14); color: white; flex: 1; }

        .output {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .output-line {
            margin: 3px 0;
            line-height: 1.4;
        }

        .output-line.robot { color: #00d4ff; }
        .output-line.response { color: #00ff88; font-weight: bold; }
        .output-line.error { color: #ff6b6b; font-weight: bold; }
        .output-line.status { color: #ffd700; }

        .timestamp {
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        /* Haptic feedback simulation */
        .btn:active, .arrow-btn:active {
            animation: buttonPress 0.1s ease;
        }

        @keyframes buttonPress {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        /* Responsive adjustments */
        @media (max-width: 350px) {
            .container { padding: 15px; }
            .btn { padding: 15px; font-size: 14px; }
            .arrow-btn { width: 50px; height: 50px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Robot Control</h1>
            <div style="font-size: 14px; opacity: 0.8;">Via Relay Server</div>
        </div>

        <div class="connection-section">
            <input type="text" id="serverUrl" class="connection-input" 
                   placeholder="ws://relay-server-ip:8765" value="ws://localhost:8765">
            <div class="connection-buttons">
                <button class="btn btn-connect" onclick="connect()" id="connectBtn">
                    <div>🔌</div>
                    <div>Connect</div>
                </button>
                <button class="btn btn-disconnect" onclick="disconnect()" id="disconnectBtn" disabled>
                    <div>🔌</div>
                    <div>Disconnect</div>
                </button>
            </div>
        </div>

        <div class="status disconnected" id="connectionStatus">
            Disconnected from Relay Server
        </div>

        <!-- Arrow Keys Control Section -->
        <div class="arrow-section">
            <div class="arrow-title">🎮 Robot Controls</div>
            <div class="arrow-grid">
                <button class="arrow-btn arrow-up" onclick="sendCommand('walk')" id="arrowUp" disabled>⬆️</button>
                <button class="arrow-btn arrow-left" onclick="sendCommand('left')" id="arrowLeft" disabled>⬅️</button>
                <button class="arrow-btn arrow-down" onclick="sendCommand('backward')" id="arrowDown" disabled>⬇️</button>
                <button class="arrow-btn arrow-right" onclick="sendCommand('right')" id="arrowRight" disabled>➡️</button>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-stand" onclick="sendCommand('stand')" id="standBtn" disabled>
                <div>🧍</div>
                <div>Stand</div>
            </button>
            <button class="btn btn-sit" onclick="sendCommand('sit')" id="sitBtn" disabled>
                <div>🪑</div>
                <div>Sit</div>
            </button>
            <button class="btn btn-walk" onclick="sendCommand('walk')" id="walkBtn" disabled>
                <div>🚶</div>
                <div>Walk</div>
            </button>
            <button class="btn btn-distance" onclick="sendCommand('distance')" id="distanceBtn" disabled>
                <div>📏</div>
                <div>Distance</div>
            </button>
            <button class="btn btn-stop full-width" onclick="sendCommand('q')" id="stopBtn" disabled>
                <div>🛑</div>
                <div>EMERGENCY STOP</div>
            </button>
        </div>

        <div class="output" id="output">
            <div class="output-line">📱 Robot Control Interface Ready (Relay Mode)</div>
            <div class="output-line">🔌 Connect to relay server to start controlling the robot</div>
            <div class="output-line status">ℹ️ The robot must also be connected to the same relay server</div>
        </div>
    </div>

    <script>
        let websocket = null;
        let isConnected = false;
        let connectionCheckInterval = null;

        function addToOutput(message, type = 'info') {
            const output = document.getElementById('output');
            const line = document.createElement('div');
            line.className = `output-line ${type}`;

            const timestamp = new Date().toLocaleTimeString();
            line.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;

            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
            
            // Keep only last 50 lines for performance
            while (output.children.length > 50) {
                output.removeChild(output.firstChild);
            }
        }

        function updateConnectionStatus(status) {
            const statusElement = document.getElementById('connectionStatus');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const controlButtons = [
                'standBtn', 'sitBtn', 'walkBtn', 'distanceBtn', 'stopBtn',
                'arrowUp', 'arrowDown', 'arrowLeft', 'arrowRight'
            ];

            if (status === 'connected') {
                isConnected = true;
                statusElement.textContent = '✅ Connected to Relay Server';
                statusElement.className = 'status connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                controlButtons.forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) btn.disabled = false;
                });
                
                // Start connection monitoring
                if (connectionCheckInterval) {
                    clearInterval(connectionCheckInterval);
                }
                connectionCheckInterval = setInterval(checkConnection, 2000);
                
            } else {
                isConnected = false;
                statusElement.textContent = '❌ Disconnected from Relay Server';
                statusElement.className = 'status disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                controlButtons.forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) btn.disabled = true;
                });
                
                // Stop connection monitoring
                if (connectionCheckInterval) {
                    clearInterval(connectionCheckInterval);
                    connectionCheckInterval = null;
                }
            }
        }

        function checkConnection() {
            if (websocket && websocket.readyState !== WebSocket.OPEN) {
                addToOutput('🔌 Connection lost to relay server, attempting to reconnect...', 'error');
                updateConnectionStatus('disconnected');
                websocket = null;
                // Attempt reconnection after a delay
                setTimeout(() => {
                    if (!isConnected) {
                        connect();
                    }
                }, 3000);
            }
        }

        function connect() {
            const serverUrl = document.getElementById('serverUrl').value.trim();

            if (!serverUrl) {
                addToOutput('❌ Please enter relay server URL', 'error');
                return;
            }

            // Close existing connection
            if (websocket) {
                websocket.close();
                websocket = null;
            }

            addToOutput(`🔗 Connecting to relay server: ${serverUrl}...`);

            try {
                websocket = new WebSocket(serverUrl);

                websocket.onopen = function(event) {
                    // Identify as controller
                    const identifyMsg = {
                        type: 'identify',
                        client_type: 'controller'
                    };
                    websocket.send(JSON.stringify(identifyMsg));
                };

                websocket.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        
                        if (data.type === 'status' && data.message.includes('Connected to relay server')) {
                            addToOutput('✅ Connected to relay server!', 'response');
                            updateConnectionStatus('connected');
                        } else if (data.type === 'response') {
                            // Response from robot via relay
                            const isSuccess = data.success !== false;
                            const icon = isSuccess ? '🤖✅' : '🤖❌';
                            addToOutput(`${icon} ${data.message}`, isSuccess ? 'response' : 'error');
                        } else if (data.type === 'status') {
                            addToOutput(`ℹ️ ${data.message}`, 'status');
                        } else if (data.type === 'error') {
                            addToOutput(`❌ ${data.message}`, 'error');
                        } else {
                            addToOutput(`📨 ${data.message || JSON.stringify(data)}`, 'robot');
                        }
                    } catch (e) {
                        addToOutput(`📨 ${event.data}`, 'robot');
                    }
                };

                websocket.onclose = function(event) {
                    addToOutput('🔌 Connection to relay server closed', 'error');
                    updateConnectionStatus('disconnected');
                    websocket = null;
                };

                websocket.onerror = function(error) {
                    addToOutput('❌ Relay server connection error - check server and network', 'error');
                    updateConnectionStatus('disconnected');
                };

            } catch (error) {
                addToOutput(`❌ Failed to connect to relay server: ${error.message}`, 'error');
                updateConnectionStatus('disconnected');
            }
        }

        function disconnect() {
            if (websocket) {
                websocket.close();
                websocket = null;
            }
            updateConnectionStatus('disconnected');
            addToOutput('🔌 Manually disconnected from relay server', 'robot');
        }

        function sendCommand(command) {
            if (!isConnected || !websocket || websocket.readyState !== WebSocket.OPEN) {
                addToOutput('❌ Not connected to relay server', 'error');
                updateConnectionStatus('disconnected');
                return;
            }

            const message = {
                type: 'robot_command',
                command: command
            };

            try {
                websocket.send(JSON.stringify(message));
                addToOutput(`📤 Command sent to robot via relay: ${command.toUpperCase()}`);
            } catch (error) {
                addToOutput(`❌ Failed to send command: ${error.message}`, 'error');
                updateConnectionStatus('disconnected');
            }
        }

        // Keyboard arrow key support
        document.addEventListener('keydown', function(event) {
            if (!isConnected) return;
            
            switch(event.key) {
                case 'ArrowUp':
                    sendCommand('walk');
                    event.preventDefault();
                    break;
                case 'ArrowDown':
                    sendCommand('backward');
                    event.preventDefault();
                    break;
                case 'ArrowLeft':
                    sendCommand('left');
                    event.preventDefault();
                    break;
                case 'ArrowRight':
                    sendCommand('right');
                    event.preventDefault();
                    break;
                case ' ':
                    sendCommand('q');
                    event.preventDefault();
                    break;
            }
        });

        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Initialize on page load
        window.addEventListener('load', function() {
            updateConnectionStatus('disconnected');
        });
    </script>
</body>
</html>
